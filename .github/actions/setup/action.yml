name: Set up Xcode and config
description: Selects the Xcode in .xcode-version, creates the local xcconfigs from their examples, and fetches the Satoshi fonts (git-ignored by license, but the project references them).
runs:
  using: composite
  steps:
    - name: Select Xcode
      shell: bash
      # DEVELOPER_DIR, not `sudo xcode-select`: the self-hosted Mac has no passwordless sudo,
      # and its own Xcode selection stays as it is.
      run: |
        if ! dir="$(sh scripts/select-xcode.sh)"; then
          echo "::error::The Xcode in .xcode-version is not on this runner (see the list above)."
          exit 1
        fi
        echo "DEVELOPER_DIR=$dir" >> "$GITHUB_ENV"
        DEVELOPER_DIR="$dir" xcodebuild -version
    - name: Config
      shell: bash
      run: make config
    - name: Fonts
      shell: bash
      run: make fonts
