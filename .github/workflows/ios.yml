# Pull requests and main: style, strings, unit tests, the UI smoke test (docs/CI.md).
# The job names are the required checks on `main` (docs/RELEASING.md → Branch rules);
# rename them only together with the ruleset.
name: iOS

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap Linux check: does this change touch anything that builds? A docs-only PR
  # skips the macOS jobs, and a skipped required check counts as passed.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files="$(git diff --name-only "$BASE" HEAD)"
          echo "$files"
          # Everything except docs and Markdown can affect the build.
          if echo "$files" | grep -qvE '^(docs/|.*\.md$|LICENSE$|\.github/ISSUE_TEMPLATE/|\.github/pull_request_template\.md$|\.github/CODEOWNERS$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pinned SwiftFormat and SwiftLint
        run: sh scripts/install-tools.sh
      - name: Strings (English and German complete) and entitlements
        run: make lint
      - name: SwiftFormat and SwiftLint
        run: make style

  test:
    name: Build, unit tests, UI smoke
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Ryft.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Simulator
        # Booted here, so its (slow, first-run) boot doesn't count against the tests.
        run: |
          dest="$(sh scripts/ci-simulator.sh)"
          echo "DESTINATION=$dest" >> "$GITHUB_ENV"
          udid="${dest##*id=}"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
      - name: Build for testing
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build-for-testing -scheme Ryft -destination "$DESTINATION" \
            -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO | tee build/build.log
          ! grep -E "^/.*/(Ryft|RyftTests|RyftUITests|RyftWidgets)/.*: warning:" build/build.log
      - name: Unit tests
        timeout-minutes: 15
        # A test that hangs fails after its allowance with its name, instead of the job timing out.
        # No diagnostics collection: after a failure it waited 600 s on the simulator.
        run: |
          xcodebuild test-without-building -scheme Ryft -destination "$DESTINATION" \
            -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath build/SourcePackages \
            -collect-test-diagnostics never -only-testing:RyftTests \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 60 \
            -resultBundlePath build/UnitTests.xcresult
      - name: UI smoke
        timeout-minutes: 15
        run: |
          xcodebuild test-without-building -scheme Ryft -destination "$DESTINATION" \
            -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath build/SourcePackages \
            -collect-test-diagnostics never -only-testing:RyftUITests/StoreSmokeUITests \
            -resultBundlePath build/UISmoke.xcresult
      - name: Results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: build/*.xcresult
          retention-days: 7
