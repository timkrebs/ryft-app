# Reusable: archive (Release), upload to App Store Connect, hand the build to a
# TestFlight group. Called by nightly.yml and release.yml (docs/CI.md).
name: TestFlight build

on:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to build
        type: string
        default: ""
      group:
        description: TestFlight beta group name
        type: string
        required: true
      external:
        description: Submit for beta review (external groups)
        type: boolean
        default: false
      notes:
        description: What to Test
        type: string
        default: ""
    outputs:
      build:
        description: The uploaded build number
        value: ${{ jobs.upload.outputs.build }}
    secrets:
      ASC_KEY_ID:
        required: true
      ASC_ISSUER_ID:
        required: true
      ASC_KEY_P8:
        required: true

jobs:
  upload:
    runs-on: xcode-27
    timeout-minutes: 90
    outputs:
      build: ${{ steps.version.outputs.build }}
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Fonts
        run: make fonts
      - name: Version
        id: version
        # The same formula as `make archive` (UTC yyyyMMdd.HHmmss): numbers only go up,
        # whether a build comes from CI or a Mac. Concurrency group `testflight` keeps
        # two CI builds out of the same second.
        run: |
          echo "build=$(sh scripts/build-number.sh)" >> "$GITHUB_OUTPUT"
          echo "marketing=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: API key
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
      - name: Archive and upload
        run: |
          set -o pipefail
          make lint
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH"
                -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild archive -scheme Ryft -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Ryft.xcarchive "${auth[@]}" \
            CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build }} \
            MARKETING_VERSION=${{ steps.version.outputs.marketing }}
          xcodebuild -exportArchive -archivePath build/Ryft.xcarchive -exportPath build/export \
            -exportOptionsPlist scripts/ExportOptions-upload.plist "${auth[@]}"
      - name: Distribute
        # Notes and group go through the environment, never into the script text.
        env:
          NOTES: ${{ inputs.notes }}
          GROUP: ${{ inputs.group }}
          EXTERNAL: ${{ inputs.external }}
        run: |
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.txt"
          flags=()
          [ "$EXTERNAL" = "true" ] && flags+=(--external)
          python3 scripts/testflight.py distribute --build "${{ steps.version.outputs.build }}" \
            --group "$GROUP" --notes "$RUNNER_TEMP/notes.txt" "${flags[@]}"
      - name: Tag the build
        # The weekly job writes external notes from the commits between two of these tags.
        run: |
          git tag "build/${{ steps.version.outputs.build }}"
          git push origin "build/${{ steps.version.outputs.build }}"
      - name: Archive logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: archive-logs
          path: ~/Library/Logs/DistributionLogs
          retention-days: 7
