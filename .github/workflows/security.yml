# Secret scanning on every PR (cheap, Linux) and CodeQL for Swift weekly on main.
# The repo is public, so macOS minutes for CodeQL are free (docs/RELEASING.md → Cost).
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 0"   # Sundays 03:00 UTC: CodeQL
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks 8.30.1 (pinned by checksum)
        run: |
          curl -fsSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
      - name: Scan
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # On a PR only the new commits; on main the whole history.
          if [ -n "$BASE" ]; then range="--log-opts=$BASE..HEAD"; else range=""; fi
          ./gitleaks git --redact --no-banner --config .gitleaks.toml $range .

  codeql:
    name: CodeQL (Swift)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: swift
          build-mode: manual
      - name: Build
        run: |
          xcodebuild build -scheme Ryft -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
