# Every night: main to TestFlight's internal group, when main changed (docs/CI.md).
name: Nightly TestFlight

on:
  schedule:
    - cron: "0 1 * * *"   # 01:00 UTC (02:00 / 03:00 Berlin)
  workflow_dispatch:
    inputs:
      notes:
        description: >-
          What to Test, replacing the commit list (max 4000 characters). It goes to en-US and de-DE
          alike, so write the English block, then the German one.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      notes: ${{ steps.check.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: check
        env:
          NOTES_INPUT: ${{ inputs.notes }}
        # Skipped when nothing landed since the last uploaded build (a manual run always builds).
        run: |
          last="$(git tag --list 'build/*' --sort=-creatordate | head -n1)"
          range="${last:+$last..}HEAD"
          count="$(git rev-list --count $range)"
          if [ "$count" -gt 0 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          # Notes typed into a manual run replace the generated list. They are text, never script:
          # they come in through the environment, and the output delimiter can't occur in them.
          delim="NOTES_$(openssl rand -hex 8)"
          {
            echo "notes<<$delim"
            if [ -n "$NOTES_INPUT" ]; then
              len="$(printf '%s' "$NOTES_INPUT" | python3 -c 'import sys; print(len(sys.stdin.read().strip()))')"
              if [ "$len" -gt 4000 ]; then
                echo "::error::The notes are $len characters; App Store Connect takes 4000." >&2
                exit 1
              fi
              printf '%s\n' "$NOTES_INPUT"
            else
              echo "Nightly $(date -u +%Y-%m-%d) from $(git rev-parse --short HEAD)"
              git log --no-merges --pretty='- %s' -n 30 $range
            fi
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

  testflight:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    permissions:
      contents: write   # the build/<number> tag
    uses: ./.github/workflows/_testflight.yml
    with:
      environment: internal-testflight
      group: Internal
      notes: ${{ needs.changes.outputs.notes }}
    secrets: inherit
