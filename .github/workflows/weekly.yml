# Explicitly select the physically tested build before the external environment approval (docs/CI.md).
name: External TestFlight
run-name: External TestFlight ${{ inputs.build }}

on:
  workflow_dispatch:
    inputs:
      build:
        description: Physically tested build number (yyyyMMdd.HHmmss)
        type: string
        required: true
      notes:
        description: >-
          What to Test, replacing the commit list (max 4000 characters). It goes to en-US, the app's only language.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.pin.outputs.build }}
      commit: ${{ steps.pin.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin the build and its source before approval
        id: pin
        env:
          BUILD_INPUT: ${{ inputs.build }}
        run: |
          build="$(python3 scripts/testflight.py validate-external-build "$BUILD_INPUT")"
          commit="$(git rev-parse --verify "refs/tags/build/$build^{commit}")"
          printf 'build=%s\ncommit=%s\n' "$build" "$commit" >> "$GITHUB_OUTPUT"
          printf 'Approve external distribution of build `%s` from commit `%s`.\n' "$build" "$commit" >> "$GITHUB_STEP_SUMMARY"

  external:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # Reviewers use the candidate summary and the physical test record before releasing credentials.
    environment: external-testflight
    permissions:
      contents: write   # the testflight-external tag
    env:
      BUILD: ${{ needs.candidate.outputs.build }}
      TO: ${{ needs.candidate.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # No token in .git for the notes and distribute steps; only the tag step gets one.
          persist-credentials: false
      - name: Notes since the last external build
        env:
          NOTES_INPUT: ${{ inputs.notes }}
        run: |
          from="$(git rev-parse -q --verify 'refs/tags/testflight-external^{commit}' || true)"
          if [ -n "$NOTES_INPUT" ]; then
            len="$(printf '%s' "$NOTES_INPUT" | python3 -c 'import sys; print(len(sys.stdin.read().strip()))')"
            if [ "$len" -gt 4000 ]; then
              echo "::error::The notes are $len characters; App Store Connect takes 4000."
              exit 1
            fi
            printf '%s\n' "$NOTES_INPUT" > "$RUNNER_TEMP/notes.txt"
          else
            {
              echo "RYFT build $BUILD:"
              git log --no-merges --pretty='- %s' -n 40 "${from:+$from..}$TO"
            } > "$RUNNER_TEMP/notes.txt"
          fi
      - name: Distribute the approved build to External
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 scripts/testflight.py distribute --build "$BUILD" --group External \
            --notes "$RUNNER_TEMP/notes.txt" --external
      - name: Move the testflight-external tag
        # The token reaches git through its environment config (not argv) in this step only.
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$GITHUB_SERVER_URL/.extraheader" \
                 GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git tag -f testflight-external "$TO"
          git push -f origin testflight-external
