name: Bug
description: Something in the app doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …"
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: App version and build
      description: Profile → About, e.g. "1.0.0 (20261020.094512)".
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and iOS version
      placeholder: iPhone 16 Pro, iOS 27.1
  - type: input
    id: request
    attributes:
      label: Request ID (if an error showed one)
      description: Tap "Details" under an error message.
